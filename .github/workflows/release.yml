name: release

# Builds the haxelib: the generated Haxe classes and the native libraries for
# each platform, so a program needs only Haxe, and tries it on each platform
# without Rust. A tag `v*` then publishes it as a release asset and submits it
# to haxelib; run by hand, it is a dry run that keeps the ZIP as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest,     name: macos-aarch64 }
          - { os: windows-latest,   name: windows-x86_64 }
          # Cross-compiled static libraries: hxcpp links one into the program,
          # and Ash links one into a HashLink program for a mobile device.
          # GitHub has no Intel macOS runner to build an .hdll on, so Intel
          # Macs get the hxcpp library alone.
          - { os: macos-latest,  name: macos-x86_64,  runtimes: cpp,    target: x86_64-apple-darwin }
          - { os: macos-latest,  name: ios,           runtimes: hl cpp, target: aarch64-apple-ios }
          - { os: macos-latest,  name: ios-simulator, runtimes: hl cpp, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, name: android,       runtimes: hl cpp, target: aarch64-linux-android }
          - { os: ubuntu-latest, name: ash-wasm-threads, runtimes: hl, wasm: true, threads: true }
          - { os: ubuntu-latest, name: emcc-wasm, runtimes: cpp, wasm: true, emcc: true }
          - { os: ubuntu-latest, name: emcc-wasm-threads, runtimes: cpp, wasm: true, threads: true, emcc: true }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: package
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - if: matrix.wasm
        run: rustup component add rust-src
      - if: matrix.emcc
        run: |
          rustup target add wasm32-unknown-emscripten
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - run: |
          if [ -f "$RUNNER_TEMP/emsdk/emsdk_env.sh" ]; then source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; fi
          hxn package ${{ matrix.runtimes || 'hl cpp' }} --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.wasm && '--wasm' || '' }} ${{ matrix.threads && '--threads' || '' }} --out package
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: package

  haxelib:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      # The classes and the manifest are the same on every platform; each
      # platform adds its native/<triple>/.
      - run: |
          mkdir haxelib
          cp -R parts/package-linux-x86_64/. haxelib/
          for part in parts/*/; do
            cp -R "$part/native/." haxelib/native/
          done
          cp -R README.md LICENSE skills haxelib/
          ls haxelib/native
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          (cd haxelib && zip -qr "../hxn-window-$version.zip" .)
          echo "ZIP=hxn-window-$version.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: haxelib
          path: ${{ env.ZIP }}

  # What a Haxe developer does, with no Rust: install the ZIP and build the
  # headless example against it, then run it on Ash and hxcpp.
  try:
    name: try, ${{ matrix.os }}
    needs: haxelib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: examples
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libx11-6 libxcursor1 libxrandr2 libxi6 libudev-dev xvfb xauth
      - if: runner.os == 'Windows' || (runner.os == 'Linux' && runner.arch != 'ARM64')
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - if: runner.os == 'macOS'
        run: |
          brew install haxe
          mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
      # setup-haxe has no Linux ARM64 build; Ubuntu packages one.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe
          mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
      # The hxn haxelib the package depends on comes from haxelib with it.
      - name: Install the haxelib and hxcpp
        run: |
          haxelib install hxn-window-*.zip --always
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --quiet
          dir="$(haxelib libpath hxcpp)"
          git -C "$dir" checkout -q 615adc73d5ef28f3f74ea47977c39c4f25ce256d
          (cd "$dir/tools/hxcpp" && haxe compile.hxml)
      - name: Install Ash
        run: |
          case "$RUNNER_OS" in
            Linux) archive=ash-linux-$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64).tar.gz ;;
            macOS) archive=ash-macos-aarch64.tar.gz ;;
            Windows) archive=ash-windows-x86_64.tar.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/ash"
          # Extracted in place: tar reads a Windows path's drive as a host.
          (cd "$RUNNER_TEMP/ash" && curl -fsSL "https://github.com/rayzor-blade/ash/releases/download/v0.1.18/$archive" | tar -xz)
          echo "ASH=$RUNNER_TEMP/ash/ash" >> "$GITHUB_ENV"
      - name: Install the matching hxn CLI
        run: |
          version="$(python3 -c 'import json,subprocess; from pathlib import Path; root=subprocess.check_output(["haxelib","libpath","hxn-window"],text=True).strip(); print(json.loads((Path(root)/"haxelib.json").read_text())["dependencies"]["hxn"])')"
          cargo install --git https://github.com/hx-n/hxn.git --tag "v$version" --locked hxn-cli
          hxn plugins
          hxn window doctor
      - name: Build and run on Ash and hxcpp
        working-directory: examples/headless
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run hxn window check hl --vm "$ASH"
          run hxn window check cpp

  publish:
    needs: [haxelib, try]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
      - run: echo "ZIP=$(ls hxn-window-*.zip)" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes "$(sed -n 's/^releasenote = "\(.*\)"/\1/p' Cargo.toml)"
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      # haxelib accepts a new project only from its first contributor.
      - env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: haxelib submit "$ZIP" darmie "$HAXELIB_PASSWORD" --never < /dev/null
