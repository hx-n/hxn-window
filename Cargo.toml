[package]
name = "hxn-window"
version = "0.2.4"
edition = "2024"
description = "Windowing and surfaces for Haxe: windows, input, monitors and native handles for rendering"
repository = "https://github.com/hx-n/hxn-window"
license = "Apache-2.0"
keywords = ["window", "input", "haxe", "hashlink", "hxcpp", "cppia", "monitors", "gamepads", "native", "surface", "rendering", "cross", "wasm"]

[lib]
name = "hxn_window"

[package.metadata.hxn]
# The native library is `xwindow.hdll` or `libxwindow.a`, and its symbols
# start with `xwindow_`.
library = "xwindow"
haxelib = "hxn-window"
contributors = ["darmie", "rayzor"]
releasenote = "Report each gamepad's USB vendor and product ids."
# The headless-window test `hxn check` and `hxn run` build.
haxe = "examples/headless"

[package.metadata.hxn.cli]
version = 1
namespace = "window"
command = ["haxe", "-lib", "hxn", "-cp", "{root}/sources", "--run", "hxn.window.cli.Tool"]
hooks = ["before-build", "before-check"]
files = ["third-party"]

[build-dependencies]
cc = "1"
x_idl = { git = "https://github.com/rayzor-blade/x-idl.git", rev = "1055cfd7e4925ebc7028175051dafb67d0b9dbe1" }
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.11" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }

# Browser controller input uses the DOM agent and xwindow-core; this is the native hub.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
xwindow-gamepad = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }
winit = "0.30"
raw-window-handle = "0.6"
xwindow-appicon = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }
xwindow-clipboard = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "9b8b53259ba94b33c2e5bdefdf3a06abbd2dc902" }

# winit on Android needs the activity the host starts.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
