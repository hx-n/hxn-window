[package]
name = "hxn-window"
version = "0.2.0"
edition = "2024"
description = "Windowing and surfaces for Haxe: windows, input, monitors and native handles for rendering"
repository = "https://github.com/hx-n/hxn-window"
license = "Apache-2.0"
keywords = ["window", "input", "haxe", "hashlink", "hxcpp", "cppia", "monitors", "gamepads", "native", "surface", "rendering"]

[lib]
name = "hxn_window"

[package.metadata.hxn]
# The native library is `xwindow.hdll` or `libxwindow.a`, and its symbols
# start with `xwindow_`.
library = "xwindow"
haxelib = "hxn-window"
contributors = ["darmie", "rayzor"]
releasenote = "Moves to the hxn.window package, on hxn 0.3.5."
# The headless-window test `hxn check` and `hxn run` build.
haxe = "examples/headless"

[build-dependencies]
x_idl = { git = "https://github.com/rayzor-blade/x-idl.git", rev = "5de6b554635f1109a7a96fdb23168a79d556de3c" }
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.5" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }
xwindow-gamepad = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
xwindow-appicon = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }
xwindow-clipboard = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "0860402ebf4e212923289c137d3ec1dcaf06cc5b" }

# winit on Android needs the activity the host starts.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
